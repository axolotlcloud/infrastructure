apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: axolotl-internal-https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
  - name: axolotl-internal
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
