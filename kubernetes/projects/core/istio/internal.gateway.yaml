apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: axolotl-internal
  namespace: istio-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: istio-internal
  addresses:
  - type: IPAddress
    value: 10.0.11.1
  listeners:
  - name: axolotl-cloud
    hostname: axolotl.cloud
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: axolotl-cloud-tls
  - name: wildcard-axolotl-cloud
    hostname: "*.axolotl.cloud"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      mode: Terminate
      certificateRefs:
      - name: axolotl-cloud-tls
