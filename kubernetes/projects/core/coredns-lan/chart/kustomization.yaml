apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
- releaseName: coredns-lan
  namespace: coredns-lan
  name: k8s-gateway
  repo: oci://codeberg.org/k8s-gateway/charts
  version: 3.7.2
  valuesFile: values.yaml

# The chart's templates don't set metadata.namespace
patches:
- target:
    kind: (ServiceAccount|ConfigMap|Service|Deployment)
  patch: |-
    - op: add
      path: /metadata/namespace
      value: coredns-lan
