apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab
  namespace: yonder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collab
  template:
    metadata:
      labels:
        app: collab
    spec:
      containers:
      - name: collab
        image: ghcr.io/yonder-sh/yonder-collab
        command:
        - node
        args:
        - .output/collab/server.mjs
        env:
        - name: HOCUSPOCUS_PORT
          value: "1234"
        - name: HOCUSPOCUS_HOST
          value: 0.0.0.0
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-app
              key: uri
        envFrom:
        - configMapRef:
            name: yonder-config
        - secretRef:
            name: yonder-secret
        - secretRef:
            name: yonder-redis-secret
        - secretRef:
            name: yonder-s3-secret
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ "ALL" ]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        ports:
        - name: http
          containerPort: 1234
        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi
