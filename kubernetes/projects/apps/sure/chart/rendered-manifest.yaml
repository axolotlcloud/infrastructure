apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: sure
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sure
    app.kubernetes.io/version: 0.7.2
    helm.sh/chart: sure-0.7.2
  name: sure
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: sure
    app.kubernetes.io/name: sure
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: sure
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: sure
    app.kubernetes.io/version: 0.7.2
    helm.sh/chart: sure-0.7.2
  name: sure-web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/component: web
      app.kubernetes.io/instance: sure
      app.kubernetes.io/name: sure
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app.kubernetes.io/component: web
        app.kubernetes.io/instance: sure
        app.kubernetes.io/name: sure
    spec:
      affinity: {}
      containers:
      - env:
        - name: RAILS_ENV
          value: production
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: SECRET_KEY_BASE
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              name: sure-secret
        - name: AI_DEBUG_MODE
          value: "false"
        - name: ONBOARDING_STATE
          value: open
        - name: SELF_HOSTED
          value: "true"
        - name: AUTH_JIT_MODE
          value: create_and_link
        - name: AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED
          value: "false"
        - name: AUTH_LOCAL_LOGIN_ENABLED
          value: "false"
        - name: GENERIC_S3_BUCKET
          value: axolotl-sure
        - name: GENERIC_S3_FORCE_PATH_STYLE
          value: "true"
        - name: GENERIC_S3_REGION
          value: us-east-1
        - name: OIDC_BUTTON_LABEL
          value: Sign in with Microsoft
        - name: OIDC_REDIRECT_URI
          value: https://finance.axolotl.cloud/auth/openid_connect/callback
        - name: WEBAUTHN_ALLOWED_ORIGINS
          value: https://finance.axolotl.cloud
        - name: WEBAUTHN_RP_ID
          value: finance.axolotl.cloud
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: postgres-app
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: attribute.value
              name: sure-oidc-secret
        - name: GENERIC_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AccessKey
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        - name: GENERIC_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: SecretKey
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        - name: GENERIC_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: Endpoint
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        envFrom:
        - configMapRef:
            name: sure-oidc-config
        - secretRef:
            name: sure-redis-secret
        image: ghcr.io/we-promise/sure:0.7.2
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /up
            port: http
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
        name: web
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /up
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits: {}
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        startupProbe:
          failureThreshold: 30
          httpGet:
            path: /up
            port: http
          periodSeconds: 5
        volumeMounts: []
      initContainers:
      - args:
        - |2

          DB_HOST=$(echo "$DATABASE_URL" | sed 's/.*@//; s/:.*//')
          until pg_isready -h "$DB_HOST" -p 5432; do echo "Waiting for DB..."; sleep 5; done

          if bundle exec rake db:pending_migrations | grep -q "pending"; then
            echo "Running db:migrate" && \
            DISABLE_DATABASE_ENVIRONMENT_CHECK=1 bundle exec rake db:migrate
          else
            echo "No pending migrations"
          fi
        command:
        - bash
        - -lc
        env:
        - name: RAILS_ENV
          value: production
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              key: SECRET_KEY_BASE
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
              name: sure-secret
        - name: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
          valueFrom:
            secretKeyRef:
              key: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
              name: sure-secret
        - name: AI_DEBUG_MODE
          value: "false"
        - name: ONBOARDING_STATE
          value: open
        - name: SELF_HOSTED
          value: "true"
        - name: AUTH_JIT_MODE
          value: create_and_link
        - name: AUTH_LOCAL_ADMIN_OVERRIDE_ENABLED
          value: "false"
        - name: AUTH_LOCAL_LOGIN_ENABLED
          value: "false"
        - name: GENERIC_S3_BUCKET
          value: axolotl-sure
        - name: GENERIC_S3_FORCE_PATH_STYLE
          value: "true"
        - name: GENERIC_S3_REGION
          value: us-east-1
        - name: OIDC_BUTTON_LABEL
          value: Sign in with Microsoft
        - name: OIDC_REDIRECT_URI
          value: https://finance.axolotl.cloud/auth/openid_connect/callback
        - name: WEBAUTHN_ALLOWED_ORIGINS
          value: https://finance.axolotl.cloud
        - name: WEBAUTHN_RP_ID
          value: finance.axolotl.cloud
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: uri
              name: postgres-app
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              key: attribute.value
              name: sure-oidc-secret
        - name: GENERIC_S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              key: AccessKey
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        - name: GENERIC_S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: SecretKey
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        - name: GENERIC_S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              key: Endpoint
              name: rook-ceph-object-user-axolotl-private-object-store-axolotl-sure
        image: ghcr.io/we-promise/sure:0.7.2
        imagePullPolicy: IfNotPresent
        name: db-migrate
        resources: {}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
      nodeSelector: {}
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      tolerations: []
      topologySpreadConstraints: []
      volumes: []
---
