apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- ./backup.objectbucketclaim.yaml
- ./backup.objectstoreuser.yaml
- ./entra
- ./httproute.yaml
- ./namespace.yaml
- ./objectbucketclaim.yaml
- ./objectstoreuser.yaml
- ./postgres.scheduledbackup.yaml
- ./postgres.yaml
- ./redis.externalsecret.yaml
- ./redis.sealedsecret.yaml
- ./redis.yaml
- ./sealedsecret.yaml
- ./secretstore.rbac.yaml
- ./secretstore.yaml

helmCharts:
- releaseName: sure
  namespace: sure
  name: sure
  repo: https://we-promise.github.io/sure
  version: 0.7.6
  valuesFile: values.yaml

patches:
- patch: |
    $patch: delete
    apiVersion: v1
    kind: Pod
    metadata:
      name: sure-test-connection
# The chart's templates don't set metadata.namespace, and kustomize's namespace field doesn't
# reach Helm output, so set it on each kind the chart renders with these values.
- target:
    kind: (Service|Deployment|Job)
  patch: |-
    - op: add
      path: /metadata/namespace
      value: sure
