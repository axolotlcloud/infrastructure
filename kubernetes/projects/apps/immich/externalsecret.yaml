apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-secret
  namespace: immich
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    kind: SecretStore
    name: k8s-store
  target:
    name: immich-secret
    template:
      data:
        immich-config.yaml: |
          ffmpeg:
            crf: 23
            threads: 0
            preset: ultrafast
            targetVideoCodec: h264
            acceptedVideoCodecs:
            - h264
            targetAudioCodec: aac
            acceptedAudioCodecs:
            - aac
            - mp3
            - libopus
            - pcm_s16le
            acceptedContainers:
            - mov
            - ogg
            - webm
            targetResolution: '720'
            maxBitrate: '0'
            bframes: -1
            refs: 0
            gopSize: 0
            temporalAQ: false
            cqMode: auto
            twoPass: false
            preferredHwDevice: auto
            transcode: required
            tonemap: hable
            accel: disabled
            accelDecode: false
          backup:
            database:
              enabled: true
              cronExpression: 0 02 * * *
              keepLastAmount: 14
          job:
            backgroundTask:
              concurrency: 5
            smartSearch:
              concurrency: 2
            metadataExtraction:
              concurrency: 5
            faceDetection:
              concurrency: 2
            search:
              concurrency: 5
            sidecar:
              concurrency: 5
            library:
              concurrency: 5
            migration:
              concurrency: 5
            thumbnailGeneration:
              concurrency: 5
            videoConversion:
              concurrency: 1
            notifications:
              concurrency: 5
          logging:
            enabled: true
            level: log
          machineLearning:
            enabled: true
            urls:
            - http://immich-machine-learning:3003
            clip:
              enabled: true
              modelName: ViT-B-32__openai
            duplicateDetection:
              enabled: true
              maxDistance: 0.01
            facialRecognition:
              enabled: true
              modelName: buffalo_l
              minScore: 0.7
              maxDistance: 0.5
              minFaces: 3
          map:
            enabled: true
            lightStyle: https://tiles.immich.cloud/v1/style/light.json
            darkStyle: https://tiles.immich.cloud/v1/style/dark.json
          reverseGeocoding:
            enabled: true
          metadata:
            faces:
              import: false
          oauth:
            enabled: true
            issuerUrl: {{ .issuerUrl }}
            clientId: {{ .clientId }}
            clientSecret: {{ .clientSecret }}
            scope: openid email profile
            profileSigningAlgorithm: none
            signingAlgorithm: RS256
            storageLabelClaim: preferred_username
            storageQuotaClaim: immich_quota
            defaultStorageQuota: 20
            buttonText: Login with Microsoft
            autoRegister: true
            autoLaunch: true
            mobileOverrideEnabled: true
            mobileRedirectUri: https://photos.axolotl.cloud/api/oauth/mobile-redirect
          passwordLogin:
            enabled: false
          storageTemplate:
            enabled: false
            hashVerificationEnabled: true
            template: "{{ `{{y}}/{{MM}}/{{dd}}/{{HH}}-{{mm}}-{{ss}}-{{filename}}` }}"
          image:
            thumbnail:
              format: webp
              size: 250
              quality: 80
            preview:
              format: jpeg
              size: 1440
              quality: 80
            colorspace: p3
            extractEmbedded: false
          newVersionCheck:
            enabled: true
          trash:
            enabled: true
            days: 30
          theme:
            customCss: ''
          library:
            scan:
              enabled: true
              cronExpression: 0 0 * * *
            watch:
              enabled: false
          server:
            externalDomain: https://photos.axolotl.cloud
            loginPageMessage: Just can't get enough axolotls!
          notifications:
            smtp:
              enabled: false
              from: ''
              replyTo: ''
              transport:
                ignoreCert: false
                host: ''
                port: 587
                username: ''
                password: ''
          user:
            deleteDelay: 7
  data:
  - secretKey: clientId
    remoteRef:
      key: immich-oidc-config-secret
      property: clientId
  - secretKey: issuerUrl
    remoteRef:
      key: immich-oidc-config-secret
      property: issuerUrl
  - secretKey: clientSecret
    remoteRef:
      key: immich-oidc-secret
      property: attribute.value
