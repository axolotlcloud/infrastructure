<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"theme","type":"enum","label":"Theme","default":"dark","options":[{"value":"dark","label":"Dark"},{"value":"light","label":"Light"}]},
    {"id":"scene","type":"enum","label":"Scenario","default":"all","options":[{"value":"all","label":"All six"},{"value":"1","label":"1 · Internet"},{"value":"2","label":"2 · Local network"},{"value":"3","label":"3 · VPN"},{"value":"4","label":"4 · Internet, admin tool"},{"value":"5","label":"5 · Internet, direct HTTPS"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=918" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 918px;
        overflow: hidden;
      }

      /* Neutral dark / warm light. Amber is the public path, blue the internal path, red is blocked. */
      #root {
        --bg: #0e0e0e;
        --zone-inet: rgba(255, 255, 255, 0.02);
        --zone-inet-border: #383838;
        --zone-private: rgba(98, 174, 252, 0.045);
        --zone-private-border: rgba(98, 174, 252, 0.6);
        --cluster-border: #404040;
        --card: #1b1b1b;
        --card-border: #333333;
        --card-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 12px 28px -12px rgba(0, 0, 0, 0.7);
        --icon-bg: #262626;
        --fg: #f0f0f0;
        --muted: #a9a9a9;
        --public: #ffb300;
        --internal: #62aefc;
        --danger: #ff6b81;
        --neutral: #8c8c8c;
        --on-accent: #111111;
        --wire-opacity: 0.5;
        --band-opacity: 0.4;
      }
      #root.theme-light {
        --bg: #faf8f5;
        --zone-inet: rgba(0, 0, 0, 0.015);
        --zone-inet-border: #cfc8bd;
        --zone-private: rgba(26, 98, 196, 0.045);
        --zone-private-border: rgba(26, 98, 196, 0.55);
        --cluster-border: #c4bcb0;
        --card: #ffffff;
        --card-border: #dcd5ca;
        --card-shadow: 0 1px 2px rgba(31, 27, 22, 0.06), 0 8px 20px -10px rgba(31, 27, 22, 0.18);
        --icon-bg: #f3efe9;
        --fg: #1f1b16;
        --muted: #5c554c;
        --public: #b85a00;
        --internal: #1a62c4;
        --danger: #c81e4c;
        --neutral: #6d665c;
        --on-accent: #ffffff;
        --wire-opacity: 0.55;
        --band-opacity: 0.3;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, sans-serif;
      }

      /* The diagram keeps the coordinates it was laid out with, and is moved up to sit under the legend. */
      .diagram {
        position: absolute;
        left: 0;
        top: -46px;
        width: 1280px;
        height: 956px;
      }
      .t-public {
        color: var(--public);
      }
      .t-internal {
        color: var(--internal);
      }

      .legend {
        position: absolute;
        right: 28px;
        top: 16px;
        height: 32px;
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 19px;
        color: var(--muted);
        white-space: nowrap;
      }
      .legend .item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .legend svg {
        flex: none;
        color: var(--fg);
      }
      .legend .tube-swatch {
        color: var(--internal);
      }
      .legend .mark-swatch {
        flex: none;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        border: 2px solid var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg);
      }
      .legend .mark-swatch svg {
        width: 13px;
        height: 13px;
      }
      .legend.key {
        left: 28px;
        right: auto;
      }
      .key .swatch {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .key .swatch.public {
        background: var(--public);
      }
      .key .swatch.internal {
        background: var(--internal);
      }

      .zone {
        position: absolute;
        left: 24px;
        width: 1232px;
        border-radius: 22px;
      }
      .zone.inet {
        top: 110px;
        height: 206px;
        border: 3px dashed var(--zone-inet-border);
        background: var(--zone-inet);
      }
      .zone.private {
        top: 340px;
        height: 528px;
        border: 3px solid var(--zone-private-border);
        background: var(--zone-private);
      }
      .label {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        white-space: nowrap;
      }
      .label svg {
        width: 21px;
        height: 21px;
        flex: none;
      }
      .label.private {
        color: var(--internal);
      }
      .cluster {
        position: absolute;
        left: 40px;
        top: 532px;
        width: 1200px;
        height: 312px;
        border: 3px dashed var(--cluster-border);
        border-radius: 18px;
      }

      svg.layer {
        position: absolute;
        inset: 0;
        width: 1280px;
        height: 956px;
        overflow: visible;
      }
      #wires {
        opacity: var(--wire-opacity);
      }
      .wire {
        fill: none;
        stroke-width: 3;
      }
      .tube {
        fill: none;
        stroke: var(--internal);
        stroke-width: 16;
        opacity: 0.35;
      }
      .band {
        fill: none;
        stroke-width: 16;
        stroke-linejoin: round;
      }
      .trail {
        fill: none;
        stroke-width: 5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .trail.dashed {
        stroke-width: 4;
        stroke-dasharray: 1 11;
      }
      .c-public {
        stroke: var(--public);
      }
      .c-internal {
        stroke: var(--internal);
      }
      .c-danger {
        stroke: var(--danger);
      }

      .dot {
        position: absolute;
        left: 0;
        top: 0;
        border-radius: 50%;
        opacity: 0;
      }
      .dot.big {
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border: 4px solid var(--bg);
      }
      .dot.small {
        width: 16px;
        height: 16px;
        margin: -8px 0 0 -8px;
        border: 3px solid var(--bg);
      }
      .dot.public {
        background: var(--public);
        box-shadow: 0 0 18px 2px rgba(255, 179, 0, 0.45);
      }
      .dot.internal {
        background: var(--internal);
        box-shadow: 0 0 18px 2px rgba(98, 174, 252, 0.45);
      }
      .dot.danger {
        background: var(--danger);
        box-shadow: 0 0 18px 2px rgba(255, 107, 129, 0.45);
      }

      .node {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        background: var(--card);
        border: 3px solid var(--card-border);
        border-radius: 16px;
        box-shadow: var(--card-shadow);
      }
      .node .ic {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: var(--icon-bg);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--fg);
      }
      .node .ic svg {
        width: 24px;
        height: 24px;
      }
      .node .txt {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
        min-width: 0;
      }
      .node .t {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.15;
        white-space: nowrap;
      }
      .node .d {
        font-size: 20px;
        color: var(--muted);
        line-height: 1.3;
        white-space: nowrap;
      }
      .node .d.mono {
        font-family: "JetBrains Mono", monospace;
        font-weight: 600;
        color: var(--fg);
      }
      .node.tone-public .t,
      .node.tone-public .ic {
        color: var(--public);
      }
      .node.tone-internal .t,
      .node.tone-internal .ic {
        color: var(--internal);
      }
      .node.tone-public .ic {
        background: color-mix(in srgb, var(--public) 14%, transparent);
      }
      .node.tone-internal .ic {
        background: color-mix(in srgb, var(--internal) 14%, transparent);
      }
      .ring {
        position: absolute;
        inset: -8px;
        border-radius: 22px;
        border: 3px solid;
        opacity: 0;
      }
      .ring.public {
        border-color: var(--public);
        box-shadow: 0 0 22px rgba(255, 179, 0, 0.3);
      }
      .ring.internal {
        border-color: var(--internal);
        box-shadow: 0 0 22px rgba(98, 174, 252, 0.3);
      }
      .ring.danger {
        border-color: var(--danger);
        box-shadow: 0 0 22px rgba(255, 107, 129, 0.3);
      }
      .ring.neutral {
        border-color: var(--neutral);
      }

      /* Chips sit over a card's last line: what you asked (outlined), what DNS answered (tinted), the result (solid). */
      .status {
        position: absolute;
        left: -8px;
        right: -8px;
        bottom: -5px;
        height: 34px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-radius: 8px;
        border: 2px solid transparent;
        font-size: 20px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
      }
      .status .ip {
        font-family: "JetBrains Mono", monospace;
        font-size: 19px;
      }
      .status.ask {
        background: var(--card);
        border-color: currentColor;
      }
      .status.answer.public {
        background: color-mix(in srgb, var(--public) 16%, var(--card));
        border-color: color-mix(in srgb, var(--public) 55%, transparent);
      }
      .status.answer.internal {
        background: color-mix(in srgb, var(--internal) 16%, var(--card));
        border-color: color-mix(in srgb, var(--internal) 55%, transparent);
      }
      .status.ask.public,
      .status.answer.public {
        color: var(--public);
      }
      .status.ask.internal,
      .status.answer.internal {
        color: var(--internal);
      }
      .status.ask.danger {
        color: var(--danger);
      }
      .status.result {
        right: auto;
        padding: 0 12px;
        color: var(--on-accent);
      }
      .status.result.public {
        background: var(--public);
      }
      .status.result.internal {
        background: var(--internal);
      }
      .status.result.danger {
        background: var(--danger);
      }

      /* mTLS hop marker: a padlock on the wire. */
      .mark {
        position: absolute;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
        border-radius: 50%;
        border: 2px solid currentColor;
        background: var(--card);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }
      .mark svg {
        width: 15px;
        height: 15px;
      }
      .mark.public {
        color: var(--public);
      }
      .mark.internal {
        color: var(--internal);
      }

      .badge {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 7px;
        height: 34px;
        padding: 0 12px;
        border-radius: 10px;
        border: 3px solid currentColor;
        background: var(--card);
        font-size: 20px;
        font-weight: 700;
        white-space: nowrap;
        opacity: 0;
      }
      .badge svg {
        width: 20px;
        height: 20px;
        flex: none;
      }
      .badge.public {
        color: var(--public);
      }
      .badge.internal {
        color: var(--internal);
      }
      .badge.danger {
        color: var(--danger);
      }

      .caption {
        position: absolute;
        left: 24px;
        top: 884px;
        width: 1232px;
        height: 56px;
        border: 3px solid var(--card-border);
        border-radius: 16px;
        background: var(--card);
      }
      .cap {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 16px;
        opacity: 0;
      }
      .pill {
        flex: none;
        font-size: 20px;
        font-weight: 700;
        color: var(--on-accent);
        padding: 3px 14px;
        border-radius: 999px;
      }
      .pill.public {
        background: var(--public);
      }
      .pill.internal {
        background: var(--internal);
      }
      .pill.danger {
        background: var(--danger);
      }
      .pill.neutral {
        background: var(--neutral);
      }
      .cap .text {
        font-size: 22px;
        line-height: 1.25;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1280"
      data-height="918"
    >
      <div class="legend key">
        <span class="item"><span class="swatch public"></span>public</span>
        <span class="item"><span class="swatch internal"></span>internal</span>
      </div>
      <div class="legend" id="legend"></div>

      <div class="diagram">
        <div class="zone inet"></div>
        <div class="zone private"></div>
        <div class="cluster"></div>
        <div id="labels"></div>

        <svg class="layer" viewBox="0 0 1280 956">
          <defs id="masks"></defs>
          <g id="wires"></g>
          <g id="bands"></g>
          <g id="trails"></g>
        </svg>
        <div id="badges"></div>
        <div id="marks"></div>
        <div id="dots"></div>
        <div id="nodes"></div>
        <div class="caption" id="caption"></div>
      </div>
    </div>

    <script>
      /* ----------------------------------------------------------------- data */

      const ICON = {
        globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
        cloud: '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
        laptop: '<rect x="4" y="5" width="16" height="11" rx="2"/><path d="M2 20h20"/>',
        monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>',
        router: '<rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6.01 17H6"/><path d="M10.01 17H10"/><path d="M15 9v4"/><path d="M17.84 6.17a4 4 0 0 0-5.66 0"/><path d="M20.66 3.34a8 8 0 0 0-11.31 0"/>',
        shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
        signpost: '<path d="M12 13v8"/><path d="M12 3v3"/><path d="M18 6a2 2 0 0 1 1.39.56l2.3 2.22a1 1 0 0 1 0 1.44l-2.3 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.39-.56L2.31 10.22a1 1 0 0 1 0-1.44L4.61 6.56A2 2 0 0 1 6 6z"/>',
        browser: '<rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 9h20"/><path d="M6 6.5h.01"/><path d="M9 6.5h.01"/>',
        grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>',
        wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
        lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
        lockOpen: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/>',
        network: '<rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"/><path d="M12 12V8"/>',
        tube: '<path d="M2 12H22" stroke-width="9" stroke-linecap="butt" opacity="0.35"/><path d="M2 12H22" stroke-width="2.5" stroke-linecap="butt"/>',
      };
      const svgIcon = (name, sw = 2) =>
        `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`;

      // Three columns (centres 242 / 640 / 1038), cards 348 wide.
      const COL = [68, 466, 864];
      const NODES = {
        inet: { x: COL[0], y: 160, w: 348, h: 92, icon: "globe", title: "Internet", lines: ["any device"] },
        cf: { x: COL[1], y: 160, w: 348, h: 92, icon: "cloud", title: "Cloudflare", lines: ["DNS, proxy, VPN"] },
        vpn: { x: COL[2], y: 160, w: 348, h: 92, icon: "laptop", title: "VPN", lines: ["signed-in device"] },
        router: { x: COL[1], y: 312, w: 348, h: 132, icon: "router", title: "Router", lines: ["inbound: HTTPS only", "→ public gateway"] },
        lan: { x: COL[2], y: 372, w: 348, h: 92, icon: "monitor", title: "Local network", lines: ["devices on the network"] },
        gwpub: { x: COL[0], y: 580, w: 348, h: 112, icon: "shield", title: "Public gateway", tone: "public", lines: ["10.0.11.20", "Cloudflare only (mTLS)"], mono: [0] },
        gwint: { x: COL[1], y: 580, w: 348, h: 112, icon: "shield", title: "Internal gateway", tone: "internal", lines: ["10.0.11.10", "local + VPN only"], mono: [0] },
        dns: { x: COL[2], y: 580, w: 348, h: 112, icon: "signpost", title: "Internal DNS", lines: ["10.0.11.53", "for *.axolotl.cloud"], mono: [0] },
        sites: { x: COL[0], y: 732, w: 348, h: 92, icon: "browser", title: "Public", tone: "public", lines: ["dennispham.me, yonder.sh"] },
        apps: { x: COL[1], y: 732, w: 348, h: 92, icon: "grid", title: '<span class="t-public">Public</span> + <span class="t-internal">internal</span>', lines: ["photos, office, …"] },
        admin: { x: COL[2], y: 732, w: 348, h: 92, icon: "wrench", title: "Internal only", tone: "internal", lines: ["argocd, grafana, …"] },
      };

      // Plain wires, coloured by the path they belong to. The only plain wire into the Axolotl network is amber.
      const WIRES = [
        ["public", [[416, 206], [466, 206]]],
        ["public", [[540, 252], [540, 312]]],
        ["internal", [[864, 418], [814, 418]]],
        ["public", [[540, 444], [540, 500], [242, 500], [242, 580]]],
        ["internal", [[640, 444], [640, 580]]],
        ["internal", [[740, 444], [740, 500], [1038, 500], [1038, 580]]],
        ["public", [[242, 692], [242, 732]]],
        ["public", [[330, 692], [330, 712], [580, 712], [580, 732]]],
        ["internal", [[640, 692], [640, 732]]],
        ["internal", [[700, 692], [700, 712], [1038, 712], [1038, 732]]],
      ];
      // The VPN is two tunnels joined at Cloudflare: device to Cloudflare, and the router's own tunnel to Cloudflare.
      const TUBES = [
        [[814, 206], [864, 206]],
        [[740, 252], [740, 312]],
      ];

      // Routes taken in the scenes. Segments inside a card are hidden by the card.
      const R = {
        askCf: [[416, 206], [560, 206]],
        pub: [[416, 206], [540, 206], [540, 500], [242, 500], [242, 636], [330, 636], [330, 712], [580, 712], [580, 778]],
        pub404: [[416, 206], [540, 206], [540, 500], [242, 500], [242, 636]],
        askLan: [[864, 418], [740, 418], [740, 500], [1038, 500], [1038, 636]],
        lan: [[864, 418], [640, 418], [640, 778]],
        tunnel: [[864, 206], [740, 206], [740, 312]],
        askVpn: [[864, 206], [740, 206], [740, 500], [1038, 500], [1038, 636]],
        vpn: [[864, 206], [740, 206], [740, 380], [640, 380], [640, 636], [700, 636], [700, 712], [1038, 712], [1038, 778]],
        https: [[242, 252], [242, 330], [540, 330], [540, 500], [242, 500], [242, 580]],
      };
      const reverse = (pts) => pts.slice().reverse();
      const polyLen = (pts) => pts.slice(1).reduce((sum, p, i) => sum + Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]), 0);

      // Pacing: requests move at a steady speed, DNS lookups a little faster.
      const REQUEST_SPEED = 400;
      const DNS_SPEED = 520;
      const RESULT_HOLD = 2.6;

      /* ---------------------------------------------------------------- build */

      const root = document.getElementById("root");
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (vars.theme === "light") root.classList.add("theme-light");
      const ONLY = vars.scene && vars.scene !== "all" ? Number(vars.scene) : 0; // render a single scenario
      const NS = "http://www.w3.org/2000/svg";
      const css = getComputedStyle(root);
      const COLOR = {};
      for (const k of ["public", "danger"]) COLOR[k] = css.getPropertyValue("--" + k).trim();
      const BAND_OPACITY = parseFloat(css.getPropertyValue("--band-opacity"));

      function roundedPath(pts, r = 14) {
        let d = `M${pts[0][0]} ${pts[0][1]}`;
        for (let i = 1; i < pts.length - 1; i++) {
          const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
          const d1 = Math.hypot(x1 - x0, y1 - y0), d2 = Math.hypot(x2 - x1, y2 - y1);
          const rr = Math.min(r, d1 / 2, d2 / 2);
          const ax = x1 + ((x0 - x1) / d1) * rr, ay = y1 + ((y0 - y1) / d1) * rr;
          const bx = x1 + ((x2 - x1) / d2) * rr, by = y1 + ((y2 - y1) / d2) * rr;
          d += ` L${ax} ${ay} Q${x1} ${y1} ${bx} ${by}`;
        }
        const last = pts[pts.length - 1];
        return d + ` L${last[0]} ${last[1]}`;
      }
      function svgEl(tag, attrs, parent) {
        const el = document.createElementNS(NS, tag);
        for (const k in attrs) el.setAttribute(k, attrs[k]);
        parent.appendChild(el);
        return el;
      }

      document.getElementById("legend").innerHTML = `
        <span class="item"><svg width="38" height="18" viewBox="6 0 38 18"><path d="M9 9H24" fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="1 11" stroke-linecap="round"/><circle cx="35" cy="9" r="6" fill="currentColor"/></svg>DNS lookup</span>
        <span class="item"><svg width="40" height="22" viewBox="6 0 40 22"><path d="M9 11H28" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="37" cy="11" r="9" fill="currentColor"/></svg>request</span>
        <span class="item"><svg class="tube-swatch" width="32" height="18" viewBox="0 0 40 18" preserveAspectRatio="none"><path d="M0 9H40" stroke="currentColor" stroke-width="16" opacity="0.35"/><path d="M0 9H40" stroke="currentColor" stroke-width="3"/></svg>VPN tunnel</span>
        <span class="item"><span class="mark-swatch">${svgIcon("lock", 2.6)}</span>mTLS</span>`;

      document.getElementById("labels").innerHTML = `
        <div class="label" style="left: 50px; top: 122px">${svgIcon("globe", 2.4)}Internet · public</div>
        <div class="label private" style="left: 50px; top: 352px">${svgIcon("network", 2.4)}Axolotl network · private</div>
        <div class="label" style="left: 66px; top: 545px">Cluster</div>`;

      const nodesEl = document.getElementById("nodes");
      for (const [id, n] of Object.entries(NODES)) {
        const el = document.createElement("div");
        el.className = "node" + (n.tone ? " tone-" + n.tone : "");
        el.id = "n-" + id;
        Object.assign(el.style, { left: n.x + "px", top: n.y + "px", width: n.w + "px", height: n.h + "px" });
        const lines = n.lines
          .map((l, i) => `<div class="d${(n.mono || []).includes(i) ? " mono" : ""}" data-layout-allow-occlusion data-layout-allow-overlap>${l}</div>`)
          .join("");
        el.innerHTML =
          `<div class="ring public"></div><div class="ring internal"></div><div class="ring danger"></div><div class="ring neutral"></div>` +
          `<div class="ic">${svgIcon(n.icon)}</div><div class="txt"><div class="t">${n.title}</div>${lines}</div>`;
        nodesEl.appendChild(el);
      }
      const lastLine = (id) => {
        const ls = document.getElementById("n-" + id).querySelectorAll(".d");
        return ls[ls.length - 1];
      };

      const wiresG = document.getElementById("wires");
      for (const pts of TUBES) svgEl("path", { class: "tube", d: roundedPath(pts) }, wiresG);
      for (const pts of TUBES) svgEl("path", { class: "wire c-internal", d: roundedPath(pts) }, wiresG);
      for (const [tone, pts] of WIRES) svgEl("path", { class: `wire c-${tone}`, d: roundedPath(pts) }, wiresG);
      const WIRE_BASE = parseFloat(getComputedStyle(wiresG).opacity); // theme-dependent resting strength

      // Chips cover a card's last line, which fades out underneath. Text may include an IP in mono: "photos → [10.0.11.10]".
      let statusN = 0;
      function status(node, text, tone, kind) {
        const el = document.createElement("div");
        el.className = `status ${kind} ${tone}`;
        el.id = `st-${++statusN}`;
        el.setAttribute("data-layout-allow-occlusion", "");
        el.setAttribute("data-layout-allow-overlap", "");
        el.setAttribute("data-layout-allow-overflow", "");
        el.innerHTML = text.replace(/\[(.+?)\]/g, '<span class="ip">$1</span>');
        document.getElementById("n-" + node).querySelector(".txt").appendChild(el);
        el._covers = lastLine(node);
        return el;
      }

      const badges = document.getElementById("badges");
      function badge(id, icon, text, tone, at) {
        const el = document.createElement("div");
        el.className = `badge ${tone}`;
        el.id = id;
        el.style.top = at.top + "px";
        el.innerHTML = svgIcon(icon, 2.6) + text;
        badges.appendChild(el);
        el.style.left = (at.left ?? Math.round(at.cx - el.offsetWidth / 2)) + "px";
        return el;
      }
      const B_CERT = badge("b-cert", "lock", "mTLS: Cloudflare cert", "public", { cx: 391, top: 483 });
      const B_NOCERT = badge("b-nocert", "lockOpen", "mTLS: no cert", "danger", { cx: 391, top: 483 });
      const B_VPN = badge("b-vpn", "tube", "VPN tunnel", "internal", { left: 762, top: 265 });

      // Inside the cluster each gateway talks to the app behind it over mTLS (Istio ambient): a padlock on that wire.
      const marksEl = document.getElementById("marks");
      function mark(id, tone, x, y) {
        const el = document.createElement("div");
        el.className = `mark ${tone}`;
        el.id = id;
        Object.assign(el.style, { left: x + "px", top: y + "px" });
        el.innerHTML = svgIcon("lock", 2.6);
        marksEl.appendChild(el);
        return el;
      }
      const M_PUB_APPS = mark("m-pub-apps", "public", 441, 712);
      const M_INT_APPS = mark("m-int-apps", "internal", 640, 712);
      const M_INT_ADMIN = mark("m-int-admin", "internal", 839, 712);

      const capEl = document.getElementById("caption");
      function caption(id, tone, pill, text) {
        const el = document.createElement("div");
        el.className = "cap";
        el.id = id;
        el.innerHTML = `<span class="pill ${tone}">${pill}</span><span class="text">${text}</span>`;
        capEl.appendChild(el);
        return el;
      }

      /* ------------------------------------------------------------- timeline */

      const tl = gsap.timeline({ paused: true });
      const bandsG = document.getElementById("bands");
      const trailsG = document.getElementById("trails");
      const masksG = document.getElementById("masks");
      const dotsEl = document.getElementById("dots");
      let uid = 0;

      // A route that draws itself (via a mask) while a dot moves along it. With noTrail only the dot moves.
      function travel(pts, tone, start, dur, opts = {}) {
        const n = ++uid;
        const d = roundedPath(pts);
        let path, reveal, len;
        if (opts.noTrail) {
          path = svgEl("path", { d, fill: "none", stroke: "none" }, trailsG);
          len = path.getTotalLength();
        } else {
          const mask = svgEl("mask", { id: `m${n}`, maskUnits: "userSpaceOnUse", x: 0, y: 0, width: 1280, height: 956 }, masksG);
          reveal = svgEl("path", { d, fill: "none", stroke: "#fff", "stroke-width": 14, "stroke-linecap": "round", "stroke-linejoin": "round" }, mask);
          path = svgEl("path", { d, class: `trail c-${tone}${opts.dashed ? " dashed" : ""}`, mask: `url(#m${n})`, opacity: 0 }, trailsG);
          len = path.getTotalLength();
          reveal.setAttribute("stroke-dasharray", `${len} ${len}`);
          reveal.setAttribute("stroke-dashoffset", len);
        }

        const dot = opts.noDot ? null : document.createElement("div");
        if (dot) {
          dot.className = `dot ${opts.dashed ? "small" : "big"} ${tone}`;
          dotsEl.appendChild(dot);
        }
        const proxy = { p: 0 };
        const place = () => {
          if (dot) {
            const pt = path.getPointAtLength(proxy.p * len);
            dot.style.transform = `translate(${pt.x}px, ${pt.y}px)`;
          }
          if (reveal) reveal.setAttribute("stroke-dashoffset", len * (1 - proxy.p));
        };
        if (!opts.noTrail) tl.set(path, { opacity: 1 }, start);
        if (dot) tl.set(dot, { opacity: 1 }, start);
        tl.fromTo(proxy, { p: 0 }, { p: 1, duration: dur, ease: "power1.inOut", onUpdate: place, onStart: place, immediateRender: false }, start);
        if (dot) tl.to(dot, { opacity: 0, duration: 0.15 }, start + dur);

        // When does the dot enter and leave each card along the way?
        const timeAt = (p) => start + (p < 0.5 ? Math.sqrt(p / 2) : 1 - Math.sqrt((1 - p) / 2)) * dur; // inverse of power1.inOut
        const enters = {}, exits = {};
        const samples = 400;
        for (const [id, nd] of Object.entries(NODES)) {
          let inside = false;
          for (let i = 0; i <= samples; i++) {
            const pt = path.getPointAtLength((i / samples) * len);
            const isIn = pt.x >= nd.x && pt.x <= nd.x + nd.w && pt.y >= nd.y && pt.y <= nd.y + nd.h;
            if (isIn && !inside) {
              enters[id] = timeAt(i / samples);
              inside = true;
            } else if (!isIn && inside) {
              exits[id] = timeAt(i / samples);
              break;
            }
          }
        }
        // ...and when does it reach a given corner of the route?
        const atVertex = (i) => timeAt(polyLen(pts.slice(0, i + 1)) / polyLen(pts));
        return { path: opts.noTrail ? null : path, end: start + dur, enters, exits, atVertex };
      }

      // Scene bookkeeping: dimming, rings, chips, bands, and the cleanup when the scene finishes.
      function scene(start, involved, cap) {
        const others = Object.keys(NODES)
          .filter((id) => !involved.includes(id))
          .map((id) => document.getElementById("n-" + id));
        tl.to(others, { opacity: 0.3, duration: 0.4, ease: "power1.out" }, start);
        tl.to(wiresG, { opacity: WIRE_BASE * 0.6, duration: 0.4, ease: "power1.out" }, start);
        const atEnd = [];
        const later = (until, fn) => (until === undefined ? atEnd.push(fn) : fn(until));
        // In the full loop each caption comes and goes with its scene; a single scenario keeps its caption up throughout.
        if (ONLY) tl.set(cap, { opacity: 1 }, 0);
        else {
          tl.fromTo(cap, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, start);
          later(undefined, (end) => tl.to(cap, { opacity: 0, y: -6, duration: 0.3, ease: "power1.in" }, end + 0.1));
        }
        const api = {
          ring(id, tone, at, until) {
            const el = document.getElementById("n-" + id).querySelector(".ring." + tone);
            tl.to(el, { opacity: 1, duration: 0.25, ease: "power2.out" }, at);
            later(until, (end) => tl.to(el, { opacity: 0, duration: 0.4, ease: "power1.in" }, end));
          },
          ringAlong(t, tone, ids) {
            for (const id of ids) if (t.enters[id] !== undefined) api.ring(id, tone, t.enters[id]);
          },
          show(el, at, until) {
            tl.fromTo(el, { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)", immediateRender: false }, at);
            if (el._covers) tl.to(el._covers, { opacity: 0, duration: 0.2 }, at);
            later(until, (end) => {
              tl.to(el, { opacity: 0, duration: 0.3, ease: "power1.in" }, end);
              if (el._covers) tl.to(el._covers, { opacity: 1, duration: 0.3 }, end + 0.1);
            });
          },
          land(id, at) {
            tl.fromTo("#n-" + id, { scale: 1 }, { scale: 1.035, duration: 0.14, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, at);
          },
          fade(t) {
            if (t.path) later(undefined, (end) => tl.to(t.path, { opacity: 0, duration: 0.35, ease: "power1.in" }, end));
          },
          // Recolour the caption pill when the outcome lands (and back again when a single scenario loops).
          pill(color, at) {
            const el = cap.querySelector(".pill");
            const from = getComputedStyle(el).backgroundColor;
            tl.fromTo(el, { backgroundColor: from }, { backgroundColor: color, duration: 0.3, immediateRender: false }, at);
            if (ONLY) later(undefined, (end) => tl.to(el, { backgroundColor: from, duration: 0.3 }, end));
          },
          // A translucent band under the cards: the VPN tunnel.
          band(pts, tone, at) {
            const p = svgEl("path", { d: roundedPath(pts), class: `band c-${tone}`, opacity: 0 }, bandsG);
            tl.to(p, { opacity: BAND_OPACITY, duration: 0.35, ease: "power1.out" }, at);
            later(undefined, (end) => tl.to(p, { opacity: 0, duration: 0.35, ease: "power1.in" }, end));
          },
          // DNS: out along the route, the answer lands on the card that answered, then the dot returns along the same trail.
          lookup(route, tone, at, node, answer, ringIds) {
            const out = travel(route, tone, at, Math.max(1.1, polyLen(route) / DNS_SPEED), { dashed: true });
            api.ringAlong(out, tone, ringIds);
            api.show(status(node, answer, tone, "answer"), out.end);
            api.land(node, out.end);
            api.fade(out);
            const back = travel(reverse(route), tone, out.end + 0.4, Math.max(0.6, polyLen(route) / 1000), { dashed: true, noTrail: true });
            return back.end;
          },
          request(route, tone, at, ringIds, ringTone) {
            const go = travel(route, tone, at, Math.max(1.4, polyLen(route) / REQUEST_SPEED));
            api.ringAlong(go, ringTone || tone, ringIds);
            api.fade(go);
            return go;
          },
          result(node, text, tone, at) {
            api.show(status(node, text, tone, "result"), at);
            api.land(node, at);
          },
          finish(end) {
            for (const fn of atEnd) fn(end);
            tl.to(others, { opacity: 1, duration: 0.4, ease: "power1.in" }, end);
            tl.to(wiresG, { opacity: WIRE_BASE, duration: 0.4, ease: "power1.in" }, end);
            return end + 0.5;
          },
        };
        return api;
      }

      // The six scenarios. run() schedules everything and returns when the result has been on screen long enough.
      const SCENARIOS = [
        {
          // Internet: public DNS points to Cloudflare, which proxies the request to the public gateway over mTLS.
          tone: "public",
          pill: "Internet",
          text: "Public DNS points to Cloudflare. The public gateway only accepts Cloudflare.",
          involved: ["inet", "cf", "router", "gwpub", "apps"],
          run(s, t0) {
            s.ring("inet", "public", t0 + 0.2);
            s.show(status("inet", "photos.axolotl.cloud", "public", "ask"), t0 + 0.3);
            const back = s.lookup(R.askCf, "public", t0 + 1.2, "cf", "photos → Cloudflare", ["cf"]);
            const go = s.request(R.pub, "public", back + 0.25, ["router", "gwpub", "apps"]);
            s.show(B_CERT, go.atVertex(3));
            s.show(M_PUB_APPS, go.exits.gwpub);
            s.result("apps", "✓ photos", "public", go.end);
            return go.end + RESULT_HOLD;
          },
        },
        {
          // Local network: internal DNS answers with the internal gateway, so the request stays on the network.
          tone: "internal",
          pill: "Local network",
          text: "Internal DNS points to the internal gateway, so requests stay on the network.",
          involved: ["lan", "router", "dns", "gwint", "apps"],
          run(s, t0) {
            s.ring("lan", "internal", t0 + 0.2);
            s.show(status("lan", "photos.axolotl.cloud", "internal", "ask"), t0 + 0.3);
            const back = s.lookup(R.askLan, "internal", t0 + 1.2, "dns", "photos → [10.0.11.10]", ["router", "dns"]);
            const go = s.request(R.lan, "internal", back + 0.25, ["gwint", "apps"]);
            s.show(M_INT_APPS, go.exits.gwint);
            s.result("apps", "✓ photos", "internal", go.end);
            return go.end + RESULT_HOLD;
          },
        },
        {
          // VPN: the device and the router both keep tunnels to Cloudflare; once through, it's the same as being on the local network.
          tone: "internal",
          pill: "VPN",
          text: "VPN devices tunnel through Cloudflare to the router, then act like local devices.",
          involved: ["vpn", "cf", "router", "dns", "gwint", "admin"],
          run(s, t0) {
            s.ring("vpn", "internal", t0 + 0.2);
            s.show(status("vpn", "argocd.axolotl.cloud", "internal", "ask"), t0 + 0.3);
            s.band(R.tunnel, "internal", t0 + 0.5);
            s.show(B_VPN, t0 + 1.0);
            const back = s.lookup(R.askVpn, "internal", t0 + 1.6, "dns", "argocd → [10.0.11.10]", ["cf", "router", "dns"]);
            const go = s.request(R.vpn, "internal", back + 0.25, ["gwint", "admin"]);
            s.show(M_INT_ADMIN, go.exits.gwint);
            s.result("admin", "✓ argocd", "internal", go.end);
            return go.end + RESULT_HOLD;
          },
        },
        {
          // Internal only: internal-only apps have no route on the public gateway, so the internet gets a 404.
          tone: "public",
          pill: "Internet",
          text: "The public gateway has no route for internal-only apps, so the internet gets a 404.",
          involved: ["inet", "cf", "router", "gwpub"],
          run(s, t0) {
            s.ring("inet", "public", t0 + 0.2);
            s.show(status("inet", "argocd.axolotl.cloud", "public", "ask"), t0 + 0.3);
            const back = s.lookup(R.askCf, "public", t0 + 1.2, "cf", "argocd → Cloudflare", ["cf"]);
            const go = s.request(R.pub404, "public", back + 0.25, ["router"]);
            s.show(B_CERT, go.atVertex(3));
            s.ring("gwpub", "danger", go.end - 0.1);
            s.result("gwpub", "✗ 404: no route", "danger", go.end);
            s.pill(COLOR.danger, go.end);
            return go.end + RESULT_HOLD;
          },
        },
        {
          // Blocked at the gateway: HTTPS gets through the router, but without Cloudflare's client cert the gateway rejects it.
          tone: "danger",
          pill: "Internet",
          text: "Direct HTTPS reaches the public gateway, which rejects it: no Cloudflare cert.",
          involved: ["inet", "router", "gwpub"],
          run(s, t0) {
            s.ring("inet", "danger", t0 + 0.2);
            s.show(status("inet", "public IP · HTTPS", "danger", "ask"), t0 + 0.3);
            const go = s.request(R.https, "danger", t0 + 0.9, ["router"], "neutral");
            s.show(B_NOCERT, go.atVertex(4));
            s.ring("gwpub", "danger", go.end - 0.1);
            s.result("gwpub", "✗ rejected", "danger", go.end);
            return go.end + RESULT_HOLD;
          },
        },
      ];

      let t0;
      if (!ONLY) {
        // All six in a row. The overview caption opens the loop and closes it, so the last frame matches the first.
        const intro = caption("cap0", "neutral", "Overview", "Five requests: from the internet, on the local network, on the VPN, then two that fail.");
        tl.set(intro, { opacity: 1 }, 0);
        tl.to(intro, { opacity: 0, y: -6, duration: 0.3, ease: "power1.in" }, 3.7);
        t0 = 4.0;
        SCENARIOS.forEach((sc, i) => {
          const s = scene(t0, sc.involved, caption("cap" + (i + 1), sc.tone, `${i + 1} · ${sc.pill}`, sc.text));
          t0 = s.finish(sc.run(s, t0));
        });
        tl.to(intro, { opacity: 1, y: 0, duration: 0.35, ease: "power1.out" }, t0);
        t0 += 0.35;
      } else {
        // One scenario on its own loop: its caption stays up, and the full map rests for a moment at the loop point.
        const sc = SCENARIOS[ONLY - 1];
        const s = scene(0.8, sc.involved, caption("cap" + ONLY, sc.tone, sc.pill, sc.text));
        t0 = s.finish(sc.run(s, 0.8)) + 0.3;
      }
      // The root has no data-duration, so the render length is the timeline's: end it on a whole frame.
      tl.set({}, {}, Math.ceil(t0 * 10) / 10);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
